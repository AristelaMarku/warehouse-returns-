<mat-sidenav-container>
  <mat-sidenav mode="side" opened>
    <div class="sidenav-logo">Warehouse Returns</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/rmas" routerLinkActive="active-link">
        <mat-icon matListItemIcon>assignment_return</mat-icon>
        <span matListItemTitle>Returns</span>
      </a>
      <a mat-list-item routerLink="/receipts" routerLinkActive="active-link">
        <mat-icon matListItemIcon>inventory</mat-icon>
        <span matListItemTitle>Received Devices</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <div class="sidenav-user">
        <mat-icon class="sidenav-user-icon">account_circle</mat-icon>
        <div class="sidenav-user-info">
          <span class="sidenav-user-name">{{ auth.currentUser()?.displayName || auth.currentUser()?.username }}</span>
          <span class="sidenav-user-role">{{ auth.currentUser()?.role }}</span>
        </div>
      </div>
      <button mat-icon-button class="sidenav-logout" (click)="auth.logout()" title="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span class="toolbar-spacer"></span>
      <span class="user-info">
        {{ auth.currentUser()?.displayName || auth.currentUser()?.username }}
        <small class="user-role">({{ auth.currentUser()?.role }})</small>
      </span>
      <button mat-icon-button (click)="auth.logout()" title="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="page-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
