<mat-sidenav-container>
  <mat-sidenav mode="side" opened>
    <div class="sidenav-logo">Warehouse Returns</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/rmas" routerLinkActive="active-link">
        <mat-icon matListItemIcon>assignment_return</mat-icon>
        <span matListItemTitle>Returns</span>
      </a>
      <a mat-list-item routerLink="/receipts" routerLinkActive="active-link">
        <mat-icon matListItemIcon>inventory</mat-icon>
        <span matListItemTitle>Received Devices</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span class="toolbar-spacer"></span>
      <div class="toolbar-profile">
        <mat-icon class="profile-avatar">account_circle</mat-icon>
        <div class="profile-text">
          <span class="profile-name">{{ auth.currentUser()?.displayName || auth.currentUser()?.username }}</span>
          <span class="profile-role">{{ auth.currentUser()?.role }}</span>
        </div>
        <button mat-icon-button (click)="auth.logout()" title="Logout" class="logout-btn">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </mat-toolbar>

    <div class="page-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
