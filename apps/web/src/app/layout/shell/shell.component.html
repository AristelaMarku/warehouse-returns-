<mat-sidenav-container>
  <mat-sidenav mode="side" opened>
    <div class="sidenav-logo">Warehouse Returns</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/rmas" routerLinkActive="active-link">
        <mat-icon matListItemIcon>assignment_return</mat-icon>
        <span matListItemTitle>Returns</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span class="toolbar-spacer"></span>
      <span class="user-info">
        {{ auth.currentUser()?.displayName || auth.currentUser()?.username }}
        <small class="user-role">({{ auth.currentUser()?.role }})</small>
      </span>
      <button mat-icon-button (click)="auth.logout()" title="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="page-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
